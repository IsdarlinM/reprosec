name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ReproSec
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: reprosec
          persist-credentials: false
      - name: Checkout SRIC Core dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/sric-core
          path: sric-core
          token: ${{ secrets.SRIC_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            reprosec/pyproject.toml
            sric-core/pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -c reprosec/requirements/runtime-py311.lock -e ./sric-core
      - run: python -m pip install -c reprosec/requirements/runtime-py311.lock -e './reprosec[dev]'
      - run: python -m ruff check src tests
        working-directory: reprosec
      - run: python -m mypy --strict src/reprosec
        working-directory: reprosec
      - run: python -m pytest -q
        working-directory: reprosec
      - run: python -m compileall -q src
        working-directory: reprosec
      - run: python scripts/security-scan.py
        working-directory: reprosec
      - name: Dependency audit
        run: |
          python -m pip install "pip-audit>=2,<3"
          python -m pip_audit
        working-directory: reprosec
      - run: python scripts/generate-sbom.py --output sbom.cdx.json
        working-directory: reprosec
      - name: Verify packaged Web assets
        run: |
          cmp web/index.html src/reprosec/webdist/index.html
          cmp web/main.js src/reprosec/webdist/assets/app.js
          cmp web/styles.css src/reprosec/webdist/assets/styles.css
        working-directory: reprosec
      - run: python -m build
        working-directory: reprosec
