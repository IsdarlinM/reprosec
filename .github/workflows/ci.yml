name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SENTINEL_REF: ${{ github.head_ref || github.ref_name }}

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Require private core read token
        shell: bash
        env:
          TOKEN: ${{ secrets.SENTINEL_FORGE_CI_TOKEN }}
        run: test -n "$TOKEN" || { echo 'Configure SENTINEL_FORGE_CI_TOKEN with read access to sric-core.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SENTINEL_REF }}
          path: sric-core
          token: ${{ secrets.SENTINEL_FORGE_CI_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./sric-core
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pytest ruff mypy build pip-audit hypothesis httpx httpcore h2
      - run: python -m pytest tests/standalone -q
      - run: python scripts/release-gate.py --quick
      - run: reprosec version
      - run: reprosec doctor
      - run: reprosec capabilities
