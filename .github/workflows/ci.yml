name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SRIC_CORE_CI_REF: ccfef33dc2cb45f9050b17435d65b367eb1daaea

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./sric-core
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pytest ruff mypy build pip-audit hypothesis httpx httpcore h2
      - run: python -m sric.standalone_gate --root .
      - run: python scripts/release-gate.py --quick

  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux install/uninstall preservation smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          SRIC_CORE_SOURCE: ${{ github.workspace }}/sric-core
        run: |
          TEST_HOME="${RUNNER_TEMP}/reprosec-home"
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" sh scripts/install-linux.sh
          mkdir -p "$TEST_HOME/.local/share/reprosec"
          printf 'preserve\n' > "$TEST_HOME/.local/share/reprosec/user-data.marker"
          "$TEST_HOME/.local/share/reprosec/venv/bin/reprosec" demo --output "$TEST_HOME/demo-capsule"
          HOME="$TEST_HOME" sh scripts/uninstall-linux.sh
          test -f "$TEST_HOME/.local/share/reprosec/user-data.marker"
          test -f "$TEST_HOME/demo-capsule/capsule.json"
      - name: Windows install/uninstall preservation smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'reprosec-home'
          $env:LOCALAPPDATA = Join-Path $env:USERPROFILE 'AppData\Local'
          $env:SRIC_CORE_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'sric-core'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          cmd /c scripts\install-windows.cmd
          $runtime = "$env:LOCALAPPDATA\ReproSec\venv\Scripts\reprosec.exe"
          & $runtime version
          & $runtime doctor
          & $runtime capabilities
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\ReproSec\user-data" | Out-Null
          Set-Content -Path "$env:LOCALAPPDATA\ReproSec\user-data\preserve.marker" -Value 'preserve'
          cmd /c scripts\uninstall-windows.cmd
          if (Test-Path "$env:LOCALAPPDATA\ReproSec\venv") { throw 'runtime venv was not removed' }
          if (-not (Test-Path "$env:LOCALAPPDATA\ReproSec\user-data\preserve.marker")) { throw 'user data was removed' }
