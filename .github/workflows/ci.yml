name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Sentinel Forge CI token
        shell: bash
        env:
          SENTINEL_FORGE_CI_TOKEN: ${{ secrets.SENTINEL_FORGE_CI_TOKEN }}
        run: test -n "$SENTINEL_FORGE_CI_TOKEN" || { echo 'Configure SENTINEL_FORGE_CI_TOKEN with read access to private ecosystem repositories.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: agent/release-0.5.0
          path: sric-core
          token: ${{ secrets.SENTINEL_FORGE_CI_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./sric-core
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pytest ruff mypy build pip-audit hypothesis httpx httpcore h2
      - run: python scripts/release-gate.py --quick
